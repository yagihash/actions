name: Signed Commit
description: Create a signed commit via the GitHub Git Data API
inputs:
  token:
    description: GitHub App token with contents:write permission
    required: true
  repository:
    description: Target repository (owner/repo)
    default: ${{ github.repository }}
  branch:
    description: Branch to commit to (created if it does not exist)
    required: true
  message:
    description: Commit message
    required: true
  files:
    description: Newline-separated list of file paths to commit (relative to workspace)
    required: true
  author-name:
    description: >-
      Commit author name. Leave unset (default) so GitHub attributes the
      commit to the authenticated GitHub App and auto-signs it as Verified.
      Setting this forfeits the Verified badge, since GitHub only
      auto-verifies commits with no custom author/committer info.
    default: ""
  author-email:
    description: Commit author email. See author-name for why this defaults to unset.
    default: ""
outputs:
  commit-sha:
    description: SHA of the created commit
    value: ${{ steps.commit.outputs.commit_sha }}
runs:
  using: composite
  steps:
    - name: Create signed commit
      id: commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
        MESSAGE: ${{ inputs.message }}
        FILES: ${{ inputs.files }}
        AUTHOR_NAME: ${{ inputs.author-name }}
        AUTHOR_EMAIL: ${{ inputs.author-email }}
      run: ${{ github.action_path }}/commit.sh
