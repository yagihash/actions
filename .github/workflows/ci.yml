name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      check-actions-security: ${{ steps.filter.outputs.check-actions-security }}
      ci-ok: ${{ steps.filter.outputs.ci-ok }}
      create-pull-request: ${{ steps.filter.outputs.create-pull-request }}
      dump-oidc-token: ${{ steps.filter.outputs.dump-oidc-token }}
      signed-commit: ${{ steps.filter.outputs.signed-commit }}
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          filters: |
            # ghalint / jactionlint の検査対象（と、その設定）だけを見る。.github/ 配下でも CODEOWNERS や release.yml などでは走らせない。
            workflows:
              - '.github/workflows/**'
              - '**/action.yml'
              - '**/action.yaml'
              - '.github/jactionlint.yaml'
              - '.github/jactionlint.yml'
              - '.ghalint.yaml'
              - '.ghalint.yml'
              - 'ghalint.yaml'
              - 'ghalint.yml'
              - '.github/ghalint.yaml'
              - '.github/ghalint.yml'
            check-actions-security:
              - 'check-actions-security/**'
              - '.github/workflows/ci.yml'
            ci-ok:
              - 'ci-ok/**'
              - '.github/workflows/ci.yml'
            create-pull-request:
              - 'create-pull-request/**'
              - '.github/workflows/ci.yml'
            dump-oidc-token:
              - 'dump-oidc-token/**'
              - '.github/workflows/ci.yml'
            signed-commit:
              - 'signed-commit/**'
              - '.github/workflows/ci.yml'

  # Calls the local check-actions-security action for real, on the workflows and actions of this repository. It runs when a workflow or an
  # action changed (the filter `workflows`), and when the action itself changed.
  check-actions-security:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs['check-actions-security'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action
        uses: ./check-actions-security

  ci-ok-test:
    needs: changes
    if: needs.changes.outputs['ci-ok'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck ci-ok/check.sh ci-ok/test.sh

      - name: Run unit tests
        run: ci-ok/test.sh

  # Calls the local ci-ok action for real, with the `changes` job of this workflow.
  ci-ok-action:
    needs: changes
    if: needs.changes.outputs['ci-ok'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action
        uses: ./ci-ok
        with:
          needs: ${{ toJSON(needs) }}
          filter-job: changes
          filter-outputs: |
            workflows
            ci-ok

  create-pull-request:
    needs: changes
    if: needs.changes.outputs['create-pull-request'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck create-pull-request/pr.sh

  dump-oidc-token:
    needs: changes
    if: needs.changes.outputs['dump-oidc-token'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # dump-oidc-token が OIDC の claims を取得する

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action
        id: claims
        uses: ./dump-oidc-token

      - name: Show claims output
        env:
          CLAIMS: ${{ steps.claims.outputs.claims }}
        run: echo "$CLAIMS"

  signed-commit:
    needs: changes
    if: needs.changes.outputs['signed-commit'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck signed-commit/commit.sh

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (no workflow changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, check-actions-security, ci-ok-test, ci-ok-action, create-pull-request, dump-oidc-token, signed-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: yagihash/actions/ci-ok@b2075301726190d59d2cf57e54d62700c55ae134 # v0.1.0
        with:
          needs: ${{ toJSON(needs) }}
          filter-job: changes
          filter-outputs: |
            workflows
            check-actions-security
            ci-ok
            create-pull-request
            dump-oidc-token
            signed-commit
