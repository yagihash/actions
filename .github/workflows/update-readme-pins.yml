name: "Update pinned README examples"

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-readme-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub App Token
        id: token
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: ${{ github.repository }}
          policy: writer

      - name: Install pinact
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/pinact
          version=v4.1.0
          gh release download -R suzuki-shunsuke/pinact "${version}" -p "pinact_linux_amd64.tar.gz"
          gh attestation verify "pinact_linux_amd64.tar.gz" \
            -R suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf "pinact_linux_amd64.tar.gz" pinact
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update pinned action references in READMEs
        run: |
          mapfile -t readmes < <(find . -mindepth 2 -maxdepth 2 -name README.md -not -path './.git/*' -not -path './.github/*')
          ./pinact run -u "${readmes[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for changes
        id: diff
        run: |
          changed_files=$(git diff --name-only)
          if [[ -z "$changed_files" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$changed_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release metadata
        if: steps.diff.outputs.changed == 'true'
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          version="$RELEASE_TAG"
          if [[ -z "$version" ]]; then
            version=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name')
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "branch=update-readme-pins-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Create signed commit
        if: steps.diff.outputs.changed == 'true'
        uses: ./signed-commit
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.meta.outputs.branch }}
          message: "Update pinned action references in READMEs (${{ steps.meta.outputs.version }})"
          files: ${{ steps.diff.outputs.files }}

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: ./create-pull-request
        with:
          token: ${{ steps.token.outputs.token }}
          head: ${{ steps.meta.outputs.branch }}
          title: "Update pinned action references in READMEs (${{ steps.meta.outputs.version }})"
          body: "Automated update of pinned action references in per-action READMEs after a new release."
