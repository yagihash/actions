name: "signed-commit CI"

on:
  pull_request:
    paths:
      - "signed-commit/**"
  push:
    branches:
      - main
    paths:
      - "signed-commit/**"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck signed-commit/commit.sh
