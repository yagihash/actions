name: Label PRs by changed action directory

on:
  pull_request:

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip the update-readme-pins.yml bot PR: it always touches every
    # action's README.md in one PR, so path-based labeling would tag it
    # with every action's label and misrepresent it as a feature/bugfix
    # change in the CHANGELOG. See CLAUDE.md.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'update-readme-pins-') }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
