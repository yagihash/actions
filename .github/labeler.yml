# Path-based auto-labeling rules for actions/labeler (see .github/workflows/labeler.yml).
#
# When adding a new action in <name>/, add a rule here so its PRs get an
# "action:<name>" label, then add a matching category to .github/release.yml
# so that label's changes get their own section in CHANGELOG.md:
#
# action:<name>:
#   - changed-files:
#       - any-glob-to-any-file: '<name>/**'

"action:dump-oidc-token":
  - changed-files:
      - any-glob-to-any-file: "dump-oidc-token/**"

"action:signed-commit":
  - changed-files:
      - any-glob-to-any-file: "signed-commit/**"

"action:create-pull-request":
  - changed-files:
      - any-glob-to-any-file: "create-pull-request/**"
